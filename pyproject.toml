[project]
name = "propensity-lab"
version = "1.0.0"
description = "Next-product recommendation and adoption forecasting for retail banking customers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "plotly>=5.22",
    "dash>=2.17",
    "pyarrow>=25.0.0",
    "huggingface-hub>=1.25.1",
]

[tool.uv]
package = false
